name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      - name: Build jar
        run: ./gradlew clean bootJar -x test

      - name: Start backend (test profile + H2 in-memory)
        run: |
          java -jar build/libs/*-SNAPSHOT.jar \
            --spring.profiles.active=test \
            --server.port=8080 \
            > backend.log 2>&1 &
          echo $! > backend.pid
          echo "Backend запущен с PID $(cat backend.pid)"

      - name: Wait for startup
        run: |
          echo "Ждём готовности бэкенда..."
          for i in {1..60}; do
            if curl -f -s http://localhost:8080/api/public/ping > /dev/null; then
              echo "Бэкенд готов!"
              exit 0
            fi
            sleep 1
          done
          echo "Не дождались. Лог:"
          cat backend.log
          exit 1

      - name: Run smoke tests
        run: bash tests/bash/smoke_all.sh

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-logs
          path: backend.log

      - name: Stop backend
        if: always()
        run: |
          if [ -f backend.pid ]; then
            kill $(cat backend.pid) || true
            wait $(cat backend.pid) 2>/dev/null || true
          fi